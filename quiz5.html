<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ІТ-тест для 5 класу: Хто ти в комп'ютерному світі?</title>
    <style>
        :root {
            --bg-color: #eef2f7;
            --card-bg: #ffffff;
            --primary-color: #ff7675;
            --text-color: #2d3436;
            --accent-color: #00b894;
            --btn-hover: #fab1a0;
        }
        
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            border: 3px solid #6c5ce7;
        }

        h1 {
            text-align: center;
            color: #6c5ce7;
            margin-bottom: 10px;
            font-size: 26px;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background-color: #dfe6e9;
            border-radius: 6px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;
            background-color: #6c5ce7;
            transition: width 0.3s ease;
        }

        .question-box h2 {
            font-size: 20px;
            margin-bottom: 20px;
            line-height: 1.4;
            color: #2d3436;
        }

        .options-list {
            list-style: none;
            padding: 0;
        }

        .option-btn {
            display: block;
            width: 100%;
            background: #fff;
            border: 2px solid #e2e8f0;
            padding: 14px 20px;
            margin-bottom: 12px;
            border-radius: 12px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background: #f1f2f6;
            border-color: #6c5ce7;
            transform: scale(1.01);
        }

        .result-box {
            display: none;
            text-align: center;
        }

        .result-box h3 {
            color: #6c5ce7;
            font-size: 24px;
            margin-top: 15px;
        }

        .result-desc {
            font-size: 18px;
            line-height: 1.6;
            margin-top: 15px;
            text-align: left;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            border-left: 6px solid #6c5ce7;
        }

        .restart-btn {
            background-color: #6c5ce7;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 25px;
            transition: background 0.2s;
        }

        .restart-btn:hover {
            background-color: #5b4cc4;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-section">
        <h1>Хто ти в комп'ютерному світі? 🚀</h1>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        <div class="question-box">
            <h2 id="question-text">Завантаження...</h2>
            <div class="options-list" id="options-container"></div>
        </div>
    </div>

    <div id="result-section" class="result-box">
        <h1>🎉 Твоя ІТ-роль готова!</h1>
        <h3 id="result-title"></h3>
        <div class="result-desc" id="result-description"></div>
        <button class="restart-btn" onclick="restartQuiz()">Пройти ще раз 🔄</button>
    </div>
</div>

<script>
    const questions = [
        { q: "1. Що тобі найбільше подобається робити на комп'ютері чи планшеті?", a: "Грати в ігри та думати, як вони влаштовані", b: "Малювати, обробляти фотки або створювати презентації", c: "Дивитися цікаві факти, рахувати щось або шукати відповіді в Google", d: "Налаштовувати секретні паролі, щоб ніхто не підгледів", e: "Підключати навушники, мишку та розбиратися, чому зник інтернет", keys: ["A", "B", "C", "D", "E"] },
        { q: "2. Уяви, що ти будуєш щось у Minecraft. Що це буде?", a: "Складний замок із пастками та механізмами з редстоуну", b: "Дуже красивий будинок із кольорових блоків та з садом навколо", c: "Автоматична ферма, яка збирає ресурси та рахує врожай", d: "Таємна схованка, яку ніхто на сервері не зможе знайти та підірвати", e: "Власний сервер, куди я запрошу грати всіх своїх друзів", keys: ["A", "B", "C", "D", "E"] },
        { q: "3. Твій улюблений предмет у школі (крім інформатики):", a: "Математика (люблю розв'язувати задачі)", b: "Малювання або література (люблю фантазувати)", c: "Я досліджую світ або природознавство (цікаво, як усе влаштовано)", d: "Історія або мови (люблю розгадувати таємниці та правила)", e: "Трудове навчання чи фізкультура (люблю робити щось руками або рухатись)", keys: ["A", "B", "C", "D", "E"] },
        { q: "4. Яку суперсилу ти б обрав для роботи з технікою?", a: "Створювати будь-яку гру силою думки", b: "Робити звичайні картинки рухомими та створювати мультики", c: "Знати відповіді на всі запитання у світі, як розумний робот", d: "Ставати повністю невидимим для комп'ютерних вірусів", e: "Вміти лагодити будь-який зламаний телефон чи комп'ютер за одну секунду", keys: ["A", "B", "C", "D", "E"] },
        { q: "5. Що тебя найбільше дратує, коли ти користуєшся інтернетом?", a: "Коли гра підвисає чи працює з помилками", b: "Коли сайт некрасивий, а кнопки занадто маленькі й незручні", c: "Коли Ютуб пропонує нудні відео, які мені нецікаві", d: "Коли вискакує підозріла реклама, яка заважає і лякає вірусами", e: "Коли раптово вимикається Wi-Fi або зникає мережа", keys: ["A", "B", "C", "D", "E"] },
        { q: "6. Тобі дали конструктор LEGO. Що ти з ним зробиш?", a: "Зберу робота чи машинку за власною ідеєю", b: "Зроблю красиве містечко з різнокольорових деталей", c: "Розкладу всі деталі за кольорами та розмірами перед збиранням", d: "Перевірю, чи міцна конструкція і чи не зламається вона від удару", e: "Збудую велику надійну станцію чи гараж для всієї техніки", keys: ["A", "B", "C", "D", "E"] },
        { q: "7. Що таке, на твою думку, Штучний Інтелект (наприклад, ChatGPT)?", a: "Розумна програма, яку написали за допомогою спеціального коду", b: "Помічник, який малює класні картинки за моїм описом", c: "Велика база знань, яка вміє миттєво знаходити відповіді", d: "Хитрун, з яким треба бути обережним, щоб він не вивідав секрети", e: "Потужний комп'ютер, який працює десь у великій серверній кімнаті", keys: ["A", "B", "C", "D", "E"] },
        { q: "8. Якщо твій друг забув пароль від свого акаунта, що ти порадиш?", a: "Спробувати згадати логіку, за якою він його створював", b: "Наступного разу зробити пароль із красивих і зрозумілих слів", c: "Подивитися в нотатках, куди він міг його записати", d: "Створити суперскладний новий пароль із великих літер та цифр", e: "Звернутися в підтримку або скинути налаштування через пошту", keys: ["A", "B", "C", "D", "E"] },
        { q: "9. Тобі запропонували створити свій сайт. Про що він буде?", a: "Сайт із моїми власними міні-іграми та квестами", b: "Сайт-галерея з моїми малюнками, картинками чи котиками", c: "Сайт-енциклопедія з цікавими фактами про космос чи тварин", d: "Сайт про те, як безпечно завантажувати ігри та не спіймати вірус", e: "Сайт, де інші діти зможуть спілкуватися та обмінюватися файлами", keys: ["A", "B", "C", "D", "E"] },
        { q: "10. Яка комп'ютерна гра тобі ближча?", a: "Стратегії та головоломки, де треба думати над кожним кроком", b: "Творчі ігри, де можна створювати персонажів та міняти їм одяг", c: "Вікторини, кросворди або симулятори з купою статистики", d: "Детективи, де треба шукати шпигунів та розгадувати таємниці", e: "Ігри, де треба будувати міста, дороги та керувати транспортом", keys: ["A", "B", "C", "D", "E"] },
        { q: "11. Уяви, що ти прийшов на екскурсію в ІТ-компанію. Де ти затримаєшся найдовше?", a: "Біля програміста, який пише код для нової крутої гри", b: "Біля художника, який на планшеті малює персонажів для мультиків", c: "Біля вченого, який вчить робота розпізнавати голоси людей", d: "Біля фахівця, який ловить хакерів та захищає комп'ютери", e: "У великій кімнаті з купою миготливих серверів та дротів", keys: ["A", "B", "C", "D", "E"] },
        { q: "12. Що для тебе є найкращим результатом роботи на уроці інформатики?", a: "Коли моя програма чи гра запустилася і працює без помилок", b: "Коли вчитель і весь клас кажуть: 'Вау, як це красиво виглядає!'", c: "Коли я дізнався щось абсолютно нове і розібрався в складній темі", d: "Коли я знайшов помилку в тесті або захистив свій проєкт від збоїв", e: "Коли я допоміг усім налаштувати комп'ютери для практичної роботи", keys: ["A", "B", "C", "D", "E"] },
        { q: "13. Якби ти міг розробити робота майбутнього, що б він робил?", a: "Сам писав би програми для інших роботів", b: "Придумував би нові красиві моделі одягу або дизайн кімнат", c: "Допомагав би вченим передбачати погоду та лікувати людей", d: "Охороняв би будинки від злодіїв та стежив за безпекою", e: "Прибирав би в домі, лагодив техніку та заряджав пристрої", keys: ["A", "B", "C", "D", "E"] },
        { q: "14. Якщо на екрані з'явилося дивне віконце з написом 'Ви виграли мільйон, натисніть сюди', ти:", a: "Подивлюся, як влаштована ця сторінка і чому вона вискочила", b: "Подумаю, що дизайн цього вікна дуже підозрілий і некрасивий", c: "Порахую, яка ймовірність виграти мільйон просто так (вона дорівнює нулю)", d: "Одразу закрию вікно, бо це обман та небезпечний вірус!", e: "Перевірю антивірусом систему та закрию браузер через диспетчер завдань", keys: ["A", "B", "C", "D", "E"] },
        { q: "15. Комп'ютер — це великий замок. Хто ти в цьому замку?", a: "Чарівник, який створює нові заклинання (пише програми)", b: "Архітектор, який прикрашає зали та робить їх затишними (дизайнер)", c: "Звєздочот, який рахує зірки та веде розумні книги (аналітик)", d: "Лицар-охоронець, який захищає замок від ворогів (кібербезпека)", e: "Комендант, який стежить, щоб у замку було світло, тепло і працювали мости (адмін)", keys: ["A", "B", "C", "D", "E"] }
    ];

    const profiles = {
        "A": {
            title: "💻 Програміст-винахідник!",
            desc: "Тобі подобається створювати щось нове, вигадувати правила та бачити, як твої ідеї працюють. Ти майбутній творець ігор, мобільних додатків чи крутих сайтів. Тобі підійде вивчення мови програмування Python або візуального кодингу Scratch!"
        },
        "B": {
            title: "🎨 Комп'ютерний художник та дизайнер!",
            desc: "Ти бачиш світ яскравим та творчим! Тобі важливо, щоб усе навколо було красивим та зручним. Ти можеш стати UI/UX дизайнером, 3D-художником або створювати графіку для комп'ютерних ігор. Тобі сподобається малювання у Canva, Figma або Blender!"
        },
        "C": {
            title: "📊 Майстер логіки та Штучного Інтелекту!",
            desc: "Ти дуже допитливий і любиш розгадувати складні загадки та працювати з фактами. З тебе вийде чудовий аналітик даних або розробник роботів та розумних нейромереж. Продовжуй дружити з математикою та логічними іграми!"
        },
        "D": {
            title: "🛡️ Цифровий супергерой (Експерт із кібербезпеки)!",
            desc: "Ти дуже уважний і вмієш помічати небезпеку там, де інші її не бачать. Твоя суперсила — захищати інформацію, ловити комп'ютерні віруси та протидіяти хакерам. Світ ІТ потребує таких надійних захисників!"
        },
        "E": {
            title: "⚙️ Майстер комп'ютерів та заліза!",
            desc: "Ти любиш, коли техніка працює як годинник. Тобі цікаво розбиратися в пристроях, дротах, мережах та налаштуваннях. Ти майбутній системний адміністратор чи інженер, без якого не зможе працювати жодна велика ІТ-компанія!"
        }
    };

    let currentQuestionIndex = 0;
    let scores = { "A": 0, "B": 0, "C": 0, "D": 0, "E": 0 };

    function loadQuestion() {
        const progress = document.getElementById("progress");
        progress.style.width = `${(currentQuestionIndex / questions.length) * 100}%`;

        if (currentQuestionIndex >= questions.length) {
            showResults();
            return;
        }

        const currentQuestion = questions[currentQuestionIndex];
        document.getElementById("question-text").innerText = currentQuestion.q;

        const container = document.getElementById("options-container");
        container.innerHTML = "";

        const optionLabels = ['a', 'b', 'c', 'd', 'e'];
        optionLabels.forEach((label, index) => {
            const button = document.createElement("button");
            button.className = "option-btn";
            button.innerText = currentQuestion[label];
            button.onclick = () => selectOption(currentQuestion.keys[index]);
            container.appendChild(button);
        });
    }

    function selectOption(key) {
        scores[key]++;
        currentQuestionIndex++;
        loadQuestion();
    }

    function showResults() {
        document.getElementById("quiz-section").style.display = "none";
        document.getElementById("result-section").style.display = "block";

        let maxKey = "A";
        let maxScore = scores["A"];

        for (let key in scores) {
            if (scores[key] > maxScore) {
                maxScore = scores[key];
                maxKey = key;
            }
        }

        const userProfile = profiles[maxKey];
        document.getElementById("result-title").innerText = userProfile.title;
        document.getElementById("result-description").innerText = userProfile.desc;
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        scores = { "A": 0, "B": 0, "C": 0, "D": 0, "E": 0 };
        document.getElementById("quiz-section").style.display = "block";
        document.getElementById("result-section").style.display = "none";
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
