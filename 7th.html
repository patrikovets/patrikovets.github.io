// Render Questions
const container = document.getElementById('questions-container');
questions.forEach((q, qIndex) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    
    const title = document.createElement('div');
    title.className = 'question-title';
    title.innerText = `${qIndex + 1}. ${q.q}`;
    card.appendChild(title);
    
    const optionsDiv = document.createElement('div');
    optionsDiv.className = 'options';
    
    q.options.forEach((opt, oIndex) => {
        const label = document.createElement('label');
        label.className = 'option-label';
        
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = `q${qIndex}`;
        radio.value = opt.cat;
        if(oIndex === 0) radio.required = true; // basic validation
        
        label.appendChild(radio);
        label.appendChild(document.createTextNode(opt.text));
        optionsDiv.appendChild(label);
    });
    
    card.appendChild(optionsDiv);
    container.appendChild(card);
});

function calculateResult() {
    const form = document.getElementById('quiz-form');
    const formData = new FormData(form);
    
    let scores = { prog: 0, design: 0, data: 0, tech: 0 };
    let answeredCount = 0;
    
    for (let i = 0; i < questions.length; i++) {
        const answer = formData.get(`q${i}`);
        if (answer) {
            scores[answer]++;
            answeredCount++;
        }
    }
    
    if (answeredCount < questions.length) {
        alert(`Будь ласка, дайте відповіді на всі запитання! (Відповідей: ${answeredCount} з ${questions.length})`);
        return;
    }
    
    // Find top profile
    let topCat = 'prog';
    for (let cat in scores) {
        if (scores[cat] > scores[topCat]) {
            topCat = cat;
        }
    }
    
    // Show results box
    document.getElementById('top-profile').innerText = categories[topCat].title;
    document.getElementById('profile-details').innerText = categories[topCat].desc;
    
    // Render chart scores
    const chartResults = document.getElementById('chart-results');
    chartResults.innerHTML = '';
    
    for (let cat in scores) {
        const percentage = Math.round((scores[cat] / questions.length) * 100);
        
        const barWrapper = document.createElement('div');
        barWrapper.className = 'chart-bar-wrapper';
        
        const label = document.createElement('div');
        label.className = 'chart-label';
        label.innerText = `${categories[cat].title}: ${scores[cat]} відп. (${percentage}%)`;
        
        const barContainer = document.createElement('div');
        barContainer.className = 'chart-bar-container';
        
        const bar = document.createElement('div');
        bar.className = 'chart-bar';
        if (cat === topCat) bar.style.background = '#2ecc71'; // Green for top profile
        
        barWrapper.appendChild(label);
        barContainer.appendChild(bar);
        barWrapper.appendChild(barContainer);
        chartResults.appendChild(barWrapper);
        
        // Trigger animation
        setTimeout(() => {
            bar.style.width = `${percentage}%`;
        }, 100);
    }
    
    const resultBox = document.getElementById('result-box');
    resultBox.style.display = 'block';
    resultBox.scrollIntoView({ behavior: 'smooth' });
}
</script>

</body>
</html>
