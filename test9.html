<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест. Направлення.</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #4a90e2;
            --text-color: #333333;
            --accent-color: #2ecc71;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }

        .question-box h2 {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-list {
            list-style: none;
            padding: 0;
        }

        .option-btn {
            display: block;
            width: 100%;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background: #eef2f7;
            border-color: var(--primary-color);
        }

        .result-box {
            display: none;
            text-align: center;
        }

        .result-box h3 {
            color: var(--accent-color);
            font-size: 22px;
            margin-top: 15px;
        }

        .result-desc {
            font-size: 16px;
            line-height: 1.6;
            margin-top: 15px;
            text-align: left;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid var(--accent-color);
        }

        .restart-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 25px;
            transition: background 0.2s;
        }

        .restart-btn:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-section">
        <h1>Тест. Направлення</h1>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        <div class="question-box">
            <h2 id="question-text">Завантаження запитання...</h2>
            <div class="options-list" id="options-container"></div>
        </div>
    </div>

    <div id="result-section" class="result-box">
        <h1>Твій результат готовий!</h1>
        <h3 id="result-title"></h3>
        <div class="result-desc" id="result-description"></div>
        <button class="restart-btn" onclick="restartQuiz()">Пройти ще раз</button>
    </div>
</div>

    let currentQuestionIndex = 0;
    let scores = { "A": 0, "B": 0, "C": 0, "D": 0, "E": 0 };

    function loadQuestion() {
        const progress = document.getElementById("progress");
        progress.style.width = `${(currentQuestionIndex / questions.length) * 100}%`;

        if (currentQuestionIndex >= questions.length) {
            showResults();
            return;
        }

        const currentQuestion = questions[currentQuestionIndex];
        document.getElementById("question-text").innerText = currentQuestion.q;

        const container = document.getElementById("options-container");
        container.innerHTML = "";

        const optionLabels = ['a', 'b', 'c', 'd', 'e'];
        optionLabels.forEach((label, index) => {
            const button = document.createElement("button");
            button.className = "option-btn";
            button.innerText = currentQuestion[label];
            button.onclick = () => selectOption(currentQuestion.keys[index]);
            container.appendChild(button);
        });
    }

    function selectOption(key) {
        scores[key]++;
        currentQuestionIndex++;
        loadQuestion();
    }

    function showResults() {
        document.getElementById("quiz-section").style.display = "none";
        document.getElementById("result-section").style.display = "block";

        let maxKey = "A";
        let maxScore = scores["A"];

        for (let key in scores) {
            if (scores[key] > maxScore) {
                maxScore = scores[key];
                maxKey = key;
            }
        }

        const userProfile = profiles[maxKey];
        document.getElementById("result-title").innerText = userProfile.title;
        document.getElementById("result-description").innerText = userProfile.desc;
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        scores = { "A": 0, "B": 0, "C": 0, "D": 0, "E": 0 };
        document.getElementById("quiz-section").style.display = "block";
        document.getElementById("result-section").style.display = "none";
        loadQuestion();
    }

    loadQuestion();
